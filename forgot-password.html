<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Security Style -->
  <style>
  body {
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
  }
  input, textarea {
    -webkit-user-select: text;
    user-select: text;
  }
  </style>
  <!-- Security Protection -->
  <script>
  (function() {
    // Block iFrame embedding
    if (window.self !== window.top) {
      document.documentElement.innerHTML = '';
      window.location.href = 'about:blank';
      throw new Error('Embedding blocked');
    }

    // Block DevTools keyboard shortcuts
    document.addEventListener('keydown', function(e) {
      if (e.key === 'F12') { e.preventDefault(); return false; }
      if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) { e.preventDefault(); return false; }
      if (e.ctrlKey && e.key === 'U') { e.preventDefault(); return false; }
      if (e.metaKey && e.altKey && e.key === 'I') { e.preventDefault(); return false; }
      if (e.ctrlKey && e.key === 's') { e.preventDefault(); return false; }
    });

    // Block right-click context menu
    document.addEventListener('contextmenu', function(e) { e.preventDefault(); return false; });

    // Block text selection
    document.addEventListener('selectstart', function(e) { e.preventDefault(); return false; });

    // Block copy
    document.addEventListener('copy', function(e) { e.preventDefault(); return false; });

    // DevTools detection - redirect if opened
    let devToolsOpen = false;
    const threshold = 160;
    setInterval(function() {
      if (window.outerWidth - window.innerWidth > threshold || window.outerHeight - window.innerHeight > threshold) {
        if (!devToolsOpen) {
          devToolsOpen = true;
          document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;"><h2>⚠️ Access Restricted</h2></div>';
        }
      } else {
        devToolsOpen = false;
      }
    }, 1000);

    // Domain lock - only run on buyzocart.shop
    const allowedDomains = ['buyzocart.shop', 'www.buyzocart.shop', 'precious-travesseiro-e68f6e.netlify.app', 'localhost', '127.0.0.1'];
    if (!allowedDomains.includes(window.location.hostname)) {
      document.documentElement.innerHTML = '<h1>Unauthorized Domain</h1>';
      throw new Error('Unauthorized domain');
    }
  })();
  </script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=5,user-scalable=yes" />
  <title>Forgot Password - Buyzo Cart</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
  <link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png">
  <link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png">
  <meta name="description" content="Request a secure password reset link for Buyzo Cart."/>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Standalone overrides for Forgot Password page */
    .forgot-container {
      max-width: 460px;
      margin: 40px auto;
      padding: 0 16px;
    }
    .forgot-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 30px;
      box-shadow: var(--shadow);
      text-align: center;
      animation: bz-scaleIn 0.4s cubic-bezier(0.22,1,0.36,1) both;
    }
    .forgot-title {
      font-size: 22px;
      font-weight: 800;
      color: var(--ink);
      margin-bottom: 8px;
    }
    .forgot-sub {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 24px;
    }
    .input-wrap {
      text-align: left;
      margin-bottom: 18px;
    }
    .input-wrap label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .success-icon {
      font-size: 64px;
      color: var(--success);
      margin-bottom: 16px;
    }
    .toast-local {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: var(--card);
      color: var(--ink);
      padding: 12px 20px;
      border-radius: var(--radius);
      box-shadow: var(--shadow-hover);
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
      font-weight: 600;
      font-size: 14px;
    }
    .toast-local.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    .toast-local.success { border-left: 4px solid var(--success); }
    .toast-local.error { border-left: 4px solid var(--error); }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand" onclick="window.location.href='/'">
        <span class="chip">BUYZO</span>
        <span>Cart</span>
      </div>
      <div class="cta">
        <button class="theme-toggle-btn" id="themeToggleBtn" title="Toggle dark mode" aria-label="Toggle dark mode">
          <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="forgot-container">
    <div class="forgot-card" id="forgotCard">
      <!-- Input State -->
      <div id="stateInput">
        <div class="forgot-title">Forgot Password</div>
        <div class="forgot-sub">Enter your email and we'll send you a secure link to reset your password.</div>

        <form id="forgotPasswordForm" onsubmit="return false;">
          <div class="input-wrap">
            <label for="forgotEmail">Email Address</label>
            <input type="email" id="forgotEmail" placeholder="Enter your registered email" required>
          </div>

          <button class="btn" id="submitBtn" style="width:100%;padding:12px;font-size:15px;border-radius:var(--radius);margin-top:10px;">
            Send Reset Link
          </button>
        </form>

        <div style="margin-top:20px;font-size:13px;font-weight:600;">
          <a href="/?login=true" style="color:var(--accent);text-decoration:none;">Back to Login</a>
        </div>
      </div>

      <!-- Success State -->
      <div id="stateSuccess" style="display:none;">
        <div class="success-icon">✓</div>
        <div class="forgot-title">Reset Link Sent!</div>
        <div class="forgot-sub" style="margin-bottom:24px;">We've sent a password reset email to <strong id="sentEmail">your email</strong>. Please check your inbox and click the link to reset your password.</div>
        <button class="btn" onclick="window.location.href='/?login=true'" style="width:100%;padding:12px;margin-bottom:12px;">Back to Login</button>
        <button class="btn secondary" onclick="window.location.href='/'" style="width:100%;padding:12px;">Go to Storefront</button>
      </div>
    </div>
  </main>

  <footer>
    <div class="footer-container">
      <div class="copyright">
        &copy; 2024 Buyzo Cart. All rights reserved.
      </div>
    </div>
  </footer>

  <div class="toast-local" id="localToast"></div>

  <!-- Firebase Script Modules -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
    import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCHFUx3Y1L3mvyLyDMHVKQE6eXi50_fewE",
      authDomain: "buyzocart.firebaseapp.com",
      databaseURL: "https://buyzocart-default-rtdb.firebaseio.com",
      projectId: "buyzocart",
      storageBucket: "buyzocart.firebasestorage.app",
      messagingSenderId: "640560737762",
      appId: "1:640560737762:web:7fe368df6486d6da759dbb"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Toast utility
    function showToast(message, type = 'success') {
      const toast = document.getElementById('localToast');
      if (!toast) return;
      toast.textContent = message;
      toast.className = 'toast-local ' + type;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }

    async function handleForgotSubmit() {
      const emailInput = document.getElementById('forgotEmail');
      const email = emailInput ? emailInput.value.trim() : '';
      const submitBtn = document.getElementById('submitBtn');

      if (!email) {
        showToast('Please enter your email address', 'error');
        return;
      }

      // Simple email format check
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        showToast('Please enter a valid email address.', 'error');
        return;
      }

      try {
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<div class="loading-spinner"></div> Sending...';

        // Set actionCodeSettings to redirect to reset-password.html on our domain
        const actionCodeSettings = {
          url: window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
            ? window.location.origin + '/reset-password.html'
            : 'https://buyzocart.shop/reset-password.html',
          handleCodeInApp: false
        };

        await sendPasswordResetEmail(auth, email, actionCodeSettings);

        // Success state
        document.getElementById('sentEmail').textContent = email;
        document.getElementById('stateInput').style.display = 'none';
        document.getElementById('stateSuccess').style.display = 'block';
        showToast('Password reset link sent!', 'success');

      } catch (err) {
        console.error('Password reset link failed:', err);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send Reset Link';

        let friendlyMessage = 'An error occurred. Please try again.';
        const code = err.code || '';

        if (code === 'auth/user-not-found') {
          friendlyMessage = 'No account found with this email. Please sign up first.';
        } else if (code === 'auth/invalid-email') {
          friendlyMessage = 'The email address format is invalid.';
        } else if (code === 'auth/network-request-failed') {
          friendlyMessage = 'Network request failed. Please check your connection.';
        } else if (code === 'auth/too-many-requests') {
          friendlyMessage = 'Too many requests. Please try again later.';
        }

        showToast(friendlyMessage, 'error');
      }
    }

    // Attach click handler
    document.getElementById('submitBtn').addEventListener('click', handleForgotSubmit);

  </script>

  <!-- Theme Toggle -->
  <script>
    (function(){
      var saved = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', saved);
      var btn = document.getElementById('themeToggleBtn');
      if (!btn) return;
      function updateIcons(t) {
        var sun = btn.querySelector('.sun-icon'), moon = btn.querySelector('.moon-icon');
        if (t === 'dark') { if(sun)sun.style.display='none'; if(moon)moon.style.display='block'; }
        else              { if(sun)sun.style.display='block'; if(moon)moon.style.display='none'; }
      }
      updateIcons(saved);
      btn.addEventListener('click', function(){
        var cur = document.documentElement.getAttribute('data-theme');
        var next = cur === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        updateIcons(next);
      });
    })();
  </script>
</body>
</html>
